<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stacking Cards</title>
    <link rel="stylesheet" href="stacking-cards.css" />
  </head>
  <body>
    <main class="app">
      <section class="topbar">
        <div>
          <p class="eyebrow">Stacking Cards</p>
          <h1>Card Tower</h1>
        </div>
        <nav class="game-nav" aria-label="Games">
          <a href="index.html">Color by Number</a>
          <a href="snake.html">Snake</a>
          <a href="coloring.html">Coloring</a>
          <a href="stacking.html">Stacking</a>
          <a href="tom-and-cherry.html">Tom and Cherry</a>
          <a href="suika.html">Suika</a>
          <a href="ballrun2048.html">ballrun2048</a>
        </nav>
      </section>

      <section class="game-layout">
        <canvas id="gameCanvas" width="540" height="720" aria-label="Stacking Cards game board"></canvas>
        <aside class="panel">
          <div class="score-grid">
            <div>
              <span>Cards</span>
              <strong id="cardsLabel">0</strong>
            </div>
            <div>
              <span>Best</span>
              <strong id="bestLabel">0</strong>
            </div>
          </div>
          <div class="balance">
            <span>Balance</span>
            <div class="track" aria-hidden="true"><div id="balanceFill"></div></div>
          </div>
          <button id="dropButton" type="button">Drop Card</button>
          <button id="restartButton" type="button">Restart</button>
          <p id="status" role="status" aria-live="polite">Drop cards as close to center as you can.</p>
        </aside>
      </section>
    </main>

    <script src="stacking-cards.js"></script>
  </body>
</html>
