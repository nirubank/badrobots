<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Snake Game</title>
    <link rel="stylesheet" href="snake.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hud" aria-label="Game information">
        <div>
          <p class="eyebrow">The Snake Game</p>
          <h1>Snake</h1>
        </div>
        <nav class="game-nav" aria-label="Games">
          <a href="index.html">Color by Number</a>
          <a href="coloring.html">Coloring</a>
          <a href="stacking.html">Stacking</a>
          <a href="tom-and-cherry.html">Tom and Cherry</a>
          <a href="suika.html">Suika</a>
          <a href="ballrun2048.html">ballrun2048</a>
        </nav>
        <div class="scores">
          <div>
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span>Best</span>
            <strong id="bestScore">0</strong>
          </div>
        </div>
      </section>

      <section class="play-area">
        <canvas id="gameCanvas" width="480" height="480" aria-label="Snake game board"></canvas>
        <div class="side-panel">
          <button id="startButton" type="button">Start</button>
          <button id="pauseButton" type="button">Pause</button>
          <button id="restartButton" type="button">Restart</button>
          <p id="status" role="status" aria-live="polite">Press Start to play.</p>
          <div class="pad" aria-label="Direction controls">
            <button data-dir="up" type="button">Up</button>
            <button data-dir="left" type="button">Left</button>
            <button data-dir="right" type="button">Right</button>
            <button data-dir="down" type="button">Down</button>
          </div>
        </div>
      </section>
    </main>

    <script src="snake.js"></script>
  </body>
</html>
